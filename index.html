<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f3e2ba" />
<title>CuiMao AI - 眼神跟随</title>
<meta name="description" content="移动鼠标，画面里的她就会一直看着你。" />
<style>
  :root {
    --bg-fallback: #f3e2ba;
    --ink: #2a1a0e;
    --ink-soft: #6b4f3a;
    --accent: #c8703f;
    --matte: #fbf2dd;
    --ring-dark: #c8703f;
    --shadow: rgba(40, 24, 12, 0.30);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-fallback);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue",
                 "Microsoft YaHei", "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: none;
  }

  @media (hover: none) {
    body { cursor: auto; }
    .cursor { display: none !important; }
  }

  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Portrait: sprite sheet */
  .portrait {
    position: relative;
    width: min(72vmin, 600px);
    height: min(72vmin, 600px);
    border-radius: 50%;
    background: url('sprite.webp') no-repeat 0% 0% / 400% 400%;
    will-change: background-position;
    transform: translateZ(0);
    image-rendering: -webkit-optimize-contrast;
    box-shadow: 0 22px 50px var(--shadow), 0 4px 10px rgba(40, 24, 12, 0.18);
    transition: background-position 0.08s ease-out;
  }

  /* Ring overlay */
  .portrait::after {
    content: '';
    position: absolute;
    inset: 20px;
    border-radius: 50%;
    pointer-events: none;
    box-shadow: inset 0 0 0 60px var(--ring-dark);
    z-index: 2;
  }

  /* Near mode: front view */
  .portrait-front {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.18s ease;
    z-index: 1;
  }
  .portrait-front.show { opacity: 1; }

  /* Title bar */
  .top-bar, .bottom-bar {
    position: fixed;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    z-index: 5;
  }
  .top-bar { top: 30px; }
  .bottom-bar { bottom: 30px; flex-direction: column; gap: 6px; }

  .title {
    letter-spacing: 0.18em;
    font-size: 14px;
    color: var(--ink);
    text-transform: uppercase;
    font-weight: 800;
    text-shadow: 0 1px 0 rgba(255, 245, 220, 0.6);
    background: rgba(255, 240, 210, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 8px 18px;
    border-radius: 999px;
    border: 1px solid rgba(80, 50, 30, 0.18);
  }
  .title .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    margin: 0 10px;
    transform: translateY(-2px);
    box-shadow: 0 0 10px rgba(200, 112, 63, 0.7);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: translateY(-2px) scale(1); }
    50%      { opacity: 0.4; transform: translateY(-2px) scale(0.6); }
  }

  .hint {
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.06em;
    transition: opacity 0.6s ease;
    background: rgba(255, 240, 210, 0.45);
    padding: 5px 12px;
    border-radius: 999px;
  }
  .hint.fade { opacity: 0.4; }

  /* Custom cursor */
  .cursor {
    position: fixed;
    top: 0;
    left: 0;
    width: 20px;
    height: 20px;
    margin-top: -10px;
    margin-left: -10px;
    background: var(--accent);
    border-radius: 50%;
    pointer-events: none;
    z-index: 100;
    will-change: transform;
    transform: translate3d(-100px, -100px, 0);
    transition: none;
    box-shadow: 0 0 10px rgba(200, 112, 63, 0.7);
  }

  /* Loader */
  .loader {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-fallback);
    z-index: 20;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }
  .loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .loader .spinner {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 2px solid rgba(60, 30, 12, 0.12);
    border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader .label {
    position: absolute;
    bottom: 32%;
    color: var(--ink-soft);
    font-size: 12px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }

  /* Calibration panel */
  .calib {
    position: fixed;
    right: 16px;
    bottom: 16px;
    background: rgba(255, 240, 210, 0.86);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(80, 50, 30, 0.18);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    pointer-events: auto;
    z-index: 6;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .calib.show { opacity: 1; transform: translateY(0); }
  .calib b { color: var(--ink); font-weight: 700; }
  .calib .row { display: flex; align-items: center; gap: 8px; }
  .calib button {
    background: rgba(255, 250, 235, 0.7);
    color: var(--ink);
    border: 1px solid rgba(80, 50, 30, 0.22);
    border-radius: 6px;
    padding: 2px 8px;
    cursor: none;
    font-size: 11px;
    font-family: inherit;
  }
  .calib button:hover { background: rgba(200, 112, 63, 0.25); }

  /* Debug overlay */
  .debug {
    position: fixed;
    left: 16px;
    bottom: 16px;
    font-size: 11px;
    color: var(--ink-soft);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: rgba(255, 240, 210, 0.78);
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid rgba(80, 50, 30, 0.18);
    pointer-events: none;
    z-index: 6;
    line-height: 1.5;
  }
  .debug.hidden { display: none; }
</style>
</head>
<body>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    <div class="label">Loading...</div>
  </div>

  <div class="top-bar">
    <div class="title">CuiMao<span class="dot"></span>AI</div>
  </div>

  <div class="stage">
    <div class="portrait" id="portrait">
      <img class="portrait-front" id="portraitFront" src="near.webp" alt="" decoding="async" />
    </div>
  </div>

  <div class="bottom-bar">
    <div class="hint" id="hint">移动鼠标 · 她的目光会一直追随你</div>
  </div>

  <div class="cursor" id="cursor"></div>

  <div class="debug hidden" id="debug"></div>

  <div class="calib" id="calib">
    <div class="row">
      <span>校准角度偏移</span>
      <b id="offsetVal">0&deg;</b>
      <button data-d="-5">-5&deg;</button>
      <button data-d="-1">-1&deg;</button>
      <button data-d="1">+1&deg;</button>
      <button data-d="5">+5&deg;</button>
      <button id="resetBtn">重置</button>
      <button id="closeBtn">&times;</button>
    </div>
    <div class="row" style="margin-top:6px; opacity:0.7;">
      &larr; / &rarr; 微调 &middot; Shift+&larr; /&rarr; 加速 &middot; 按 C 切换 &middot; 按 D 调试
    </div>
  </div>

<script>
(function () {
  'use strict';

  // Sprite sheet: 4x4 = 16 directions
  const COLS = 4;
  const ROWS = 4;

  // Near mode threshold
  const NEAR_RATIO = 0.18;

  // DOM
  const portraitEl = document.getElementById('portrait');
  const frontEl = document.getElementById('portraitFront');
  const cursorEl = document.getElementById('cursor');
  const loaderEl = document.getElementById('loader');
  const hintEl = document.getElementById('hint');
  const calibEl = document.getElementById('calib');
  const offsetVal = document.getElementById('offsetVal');
  const debugEl = document.getElementById('debug');

  // State
  const params = new URLSearchParams(location.search);
  const urlOffsetDeg = parseFloat(params.get('offset'));
  let offsetDeg = Number.isFinite(urlOffsetDeg) ? urlOffsetDeg : 0;

  let mouseX = -1000;
  let mouseY = -1000;

  let portraitRect = null;
  let lastDirection = -1;
  let isNear = false;
  let renderScheduled = false;

  function updateRect() { portraitRect = portraitEl.getBoundingClientRect(); }
  window.addEventListener('resize', updateRect);
  window.addEventListener('scroll', updateRect, { passive: true });

  // Angle to direction: 16 directions, each 22.5 degrees
  // 0 degrees = right, clockwise
  function angleToDirection(deg) {
    deg = ((deg % 360) + 360) % 360;
    return Math.floor((deg + 11.25) / 22.5) % 16;
  }

  function setDirection(idx) {
    if (idx === lastDirection) return;
    lastDirection = idx;
    const col = idx % COLS;
    const row = Math.floor(idx / COLS);
    const px = (col / (COLS - 1)) * 100;
    const py = (row / (ROWS - 1)) * 100;
    portraitEl.style.backgroundPosition = `${px}% ${py}%`;
  }

  function setNear(near) {
    if (near === isNear) return;
    isNear = near;
    frontEl.classList.toggle('show', near);
  }

  function render() {
    renderScheduled = false;
    if (!portraitRect) updateRect();

    const cx = portraitRect.left + portraitRect.width * 0.5;
    const cy = portraitRect.top + portraitRect.height * 0.5;
    const dx = mouseX - cx;
    const dy = mouseY - cy;
    const dist = Math.hypot(dx, dy);
    const radius = portraitRect.width * 0.5;

    if (dist < radius * NEAR_RATIO) {
      setNear(true);
      setDirection(0);
      return;
    }
    setNear(false);

    let deg = Math.atan2(dx, -dy) * 180 / Math.PI;
    if (deg < 0) deg += 360;
    deg = (deg + offsetDeg) % 360;
    if (deg < 0) deg += 360;

    setDirection(angleToDirection(deg));
  }

  function scheduleRender() {
    if (renderScheduled) return;
    renderScheduled = true;
    requestAnimationFrame(render);
  }

  // Pointer events
  function setPointer(x, y) {
    mouseX = x;
    mouseY = y;
    cursorEl.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    scheduleRender();
    fadeHintOnce();
  }

  window.addEventListener('mousemove', (e) => {
    setPointer(e.clientX, e.clientY);
  }, { passive: true });

  window.addEventListener('mouseleave', () => {
    mouseX = -1000;
    mouseY = -1000;
    setNear(true);
    setDirection(0);
  });

  function touchHandler(e) {
    if (e.touches && e.touches[0]) {
      setPointer(e.touches[0].clientX, e.touches[0].clientY);
    }
  }
  window.addEventListener('touchstart', touchHandler, { passive: true });
  window.addEventListener('touchmove', touchHandler, { passive: true });

  let hintFaded = false;
  function fadeHintOnce() {
    if (hintFaded) return;
    hintFaded = true;
    setTimeout(() => hintEl.classList.add('fade'), 1500);
  }

  // Preload
  let spriteReady = false;
  let frontReady = false;

  function tryHideLoader() {
    if (spriteReady && frontReady) {
      updateRect();
      requestAnimationFrame(() => loaderEl.classList.add('hidden'));
    }
  }

  const spriteImg = new Image();
  spriteImg.onload = () => { spriteReady = true; tryHideLoader(); };
  spriteImg.onerror = () => { spriteReady = true; tryHideLoader(); };
  spriteImg.src = 'sprite.webp';

  if (frontEl.complete) { frontReady = true; }
  else {
    frontEl.addEventListener('load', () => { frontReady = true; tryHideLoader(); });
    frontEl.addEventListener('error', () => { frontReady = true; tryHideLoader(); });
  }

  setNear(true);
  setDirection(0);

  setTimeout(() => { spriteReady = frontReady = true; tryHideLoader(); }, 5000);

  // Calibration
  function setOffset(v) {
    offsetDeg = ((v % 360) + 360) % 360;
    if (offsetDeg > 180) offsetDeg -= 360;
    offsetVal.textContent = `${offsetDeg.toFixed(0)}°`;
    scheduleRender();
  }
  setOffset(offsetDeg);

  function showCalib(show) { calibEl.classList.toggle('show', show); }

  document.querySelectorAll('.calib button[data-d]').forEach((btn) => {
    btn.addEventListener('click', () => setOffset(offsetDeg + parseFloat(btn.dataset.d)));
  });
  document.getElementById('resetBtn').addEventListener('click', () => setOffset(0));
  document.getElementById('closeBtn').addEventListener('click', () => showCalib(false));

  window.addEventListener('keydown', (e) => {
    const step = e.shiftKey ? 5 : 1;
    if (e.key === 'ArrowLeft') { setOffset(offsetDeg - step); showCalib(true); e.preventDefault(); }
    if (e.key === 'ArrowRight') { setOffset(offsetDeg + step); showCalib(true); e.preventDefault(); }
    if (e.key === 'c' || e.key === 'C') { showCalib(!calibEl.classList.contains('show')); }
    if (e.key === 'd' || e.key === 'D') { debugEl.classList.toggle('hidden'); }
    if (e.key === '0') setOffset(0);
  });

  // Debug
  if (params.get('debug') === '1') debugEl.classList.remove('hidden');

  function updateDebug() {
    if (debugEl.classList.contains('hidden')) return;
    debugEl.innerHTML =
      `mouse: ${Math.round(mouseX)}, ${Math.round(mouseY)}<br>` +
      `direction: ${lastDirection} ${isNear ? '(NEAR)' : ''}<br>` +
      `offset: ${offsetDeg.toFixed(1)}°<br>` +
      `sprite: ${spriteReady ? 'ok' : '...'} · front: ${frontReady ? 'ok' : '...'}`;
  }
  setInterval(updateDebug, 80);
})();
</script>
</body>
</html>
